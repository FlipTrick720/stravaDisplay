app = "strava-display"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  # config.json lives on the mounted volume, not in the image.
  STRAVA_CONFIG_DIR = "/data"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[mounts]
  source = "strava_config"
  destination = "/data"
